<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="ff-title ff-desc">
  <title id="ff-title">Rotating cybersecurity fun facts</title>
  <desc id="ff-desc">A burgundy signal panel rotates through fifteen lighthearted facts about curiosity, debugging, and security every three seconds.</desc>
  <defs>
    <linearGradient id="ff-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset=".55" stop-color="#351023"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <pattern id="ff-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E5B5C7" stroke-opacity=".08"/></pattern>
    <linearGradient id="ff-edge" x1="0" x2="1"><stop stop-color="#701A3D"/><stop offset=".5" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D"/></linearGradient>
    <filter id="ff-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>@media (prefers-reduced-motion:reduce){.ff-animate{display:none}}</style>
  </defs>
  <rect width="1200" height="112" rx="10" fill="url(#ff-bg)"/><rect width="1200" height="112" rx="10" fill="url(#ff-grid)"/>
  <rect x="0" y="0" width="4" height="112" rx="2" fill="url(#ff-edge)"/><path d="M4 1H1199M4 111H1199" stroke="#C77B9B" stroke-opacity=".28"/>
  <text x="72" y="33" fill="#E5B5C7" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">⚡ FUN FACT · LIVE SIGNAL</text>
  <path d="M72 91H1128" stroke="#701A3D" stroke-opacity=".55"/><circle cx="1128" cy="91" r="2.5" fill="#E5B5C7"><animate class="ff-animate" attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="72" y="72" opacity="1" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">If you give a hacker 😈 a new toy, the first thing they’ll do is take it apart ⚙ to figure out how it works. 😎<animate class="ff-animate" attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.0067;0.0600;0.0667;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">A curious mind sees a login screen and wonders what happens just beyond it. 🔍<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0667;0.0734;0.1266;0.1333;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">The best debugging tool is still a careful question asked at the right time. 🧠<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1333;0.1400;0.1933;0.2000;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Computers are fast; typos are faster. ⌨️<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2067;0.2600;0.2667;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">A good backup is a time machine with excellent timing. 💾<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2667;0.2734;0.3266;0.3333;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">The command line is just a conversation with a very literal friend. 💬<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3400;0.3933;0.4000;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Every quick fix has a sequel called: why is this broken? 🧩<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4067;0.4600;0.4667;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">A tiny typo can hide in plain sight like it pays rent there. 🫥<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.4734;0.5266;0.5333;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Security gets stronger when curiosity is paired with responsibility. 🛡️<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5333;0.5400;0.5933;0.6000;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">The most suspicious bug is the one that disappears when you add a print statement. 👀<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6067;0.6600;0.6667;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">A clean diff is a love letter to whoever reviews it next. 💌<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6734;0.7266;0.7333;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Computers do exactly what you ask—and sometimes expose what you meant. 🤖<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7333;0.7400;0.7933;0.8000;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Good notes are a superpower for future-you. 📝<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8067;0.8600;0.8667;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Troubleshooting tip: check the thing you’re sure cannot be the problem. 🔧<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8667;0.8734;0.9266;0.9333;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
  <text x="72" y="72" opacity="0" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="16">Behind every mysterious error is a clue waiting for a patient investigator. 🕵️<animate class="ff-animate" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9333;0.9400;0.9933;1.0000;1" dur="45s" repeatCount="indefinite" calcMode="linear"/></text>
</svg>

