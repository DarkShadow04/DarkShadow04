  <path d="M0 1H1200M0 85H1200" stroke="#C77B9B" stroke-opacity=".32"/><path d="M30 22h22M30 22v42M1170 64h-22M1170 64V22" fill="none" stroke="#E5B5C7" stroke-opacity=".62"/>
